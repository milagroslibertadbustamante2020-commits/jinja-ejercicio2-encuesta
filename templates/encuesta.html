{% extends "base.html" %}
{% block title %}Encuesta de Desarrolladores{% endblock %}
{% block content %}
<h1>Encuesta de Desarrolladores</h1>
<form action="/resultados" method="POST">
    <label>Lenguaje favorito:</label>
    <select name="lenguaje">
        <option value="Python">Python</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Java">Java</option>
        <option value="C#">C#</option>
    </select>
    <br><br>

    <label>Años de experiencia:</label>
    <input type="number" name="experiencia" min="0" max="50">
    <br><br>

    <label>Editor favorito:</label>
    <select name="editor">
        <option value="VS Code">VS Code</option>
        <option value="PyCharm">PyCharm</option>
        <option value="Sublime Text">Sublime Text</option>
    </select>
    <br><br>

    <button type="submit">Enviar encuesta</button>
</form>
{% endblock %}
